<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Latency, throughput and error metrics for a simulated API." />
    <title>API Performance Dashboard</title>
    <script>
      // Apply the theme before the first paint, so nobody sees the wrong theme flash while the
      // app loads: the saved choice, or dark (the default) when nothing valid is saved. "system"
      // sets nothing, so prefers-color-scheme decides. Same key, values and default as
      // src/hooks/useTheme.ts.
      let theme = 'dark'
      try {
        theme = localStorage.getItem('dashboard-theme') ?? 'dark'
      } catch {
        // Storage blocked: the default applies.
      }
      if (theme !== 'system') {
        document.documentElement.dataset.theme = theme === 'light' ? 'light' : 'dark'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
