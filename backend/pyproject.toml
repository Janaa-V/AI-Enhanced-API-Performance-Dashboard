[project]
name = "api-performance-dashboard-backend"
version = "0.1.0"
description = "FastAPI backend for the AI-enhanced API performance dashboard"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2,<3",
    "sqlalchemy[asyncio]>=2,<3",
    "psycopg[binary]>=3.2,<4",
    "alembic>=1.14,<2",
]

[dependency-groups]
dev = [
    "httpx2>=2,<3",
    "pip-audit>=2.7,<3",
    "pre-commit>=4.0,<5",
    "pyright>=1.1.390,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=0.24,<2",
    "ruff>=0.9,<1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["app"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"
